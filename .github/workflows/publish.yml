name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          version="$(npm version patch -m "chore: release v%s [skip ci]")"
          echo "version=${version#v}" >> "${GITHUB_OUTPUT}"

      - name: Check package version is unpublished
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="${{ steps.version.outputs.version }}"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published."
            exit 1
          fi

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags
